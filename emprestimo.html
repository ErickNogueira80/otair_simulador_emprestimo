<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Empréstimo Diário</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f4f8; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 95vh; flex-direction: column; box-sizing: border-box; }
        .container { background: #ffffff; padding: 30px 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); width: 100%; max-width: 400px; box-sizing: border-box; border-top: 5px solid #0052cc; }
        h2 { text-align: center; color: #1e293b; margin-top: 0; margin-bottom: 25px; font-size: 22px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; color: #475569; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        input, select { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-size: 15px; background-color: #f8fafc; transition: all 0.2s; }
        input:focus, select:focus { outline: none; border-color: #0052cc; background-color: #fff; box-shadow: 0 0 0 3px rgba(0,82,204,0.1); }
        
        .resultado { background: linear-gradient(135deg, #f8fafc 0%, #edf2f7); padding: 18px; border-radius: 10px; margin-top: 20px; margin-bottom: 20px; border: 1px solid #e2e8f0; }
        .resultado p { margin: 8px 0; color: #334155; font-size: 14px; display: flex; justify-content: space-between; }
        .resultado p strong { color: #1e293b; }
        .resultado .total-destaque { font-size: 16px; border-top: 1px dashed #cbd5e1; padding-top: 8px; margin-top: 8px; color: #0052cc; }

        button { width: 100%; background: linear-gradient(135deg, #10b981 0%, #059669); color: white; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: transform 0.1s, filter 0.2s; box-shadow: 0 4px 12px rgba(16,185,129,0.3); }
        button:hover { filter: brightness(1.08); }
        button:active { transform: scale(0.98); }
        button:disabled { background: #cbd5e1; cursor: not-allowed; box-shadow: none; }
        
        .loading { text-align: center; color: #64748b; font-size: 13px; display: none; margin-top: 12px; font-weight: 600; }
        .footer { margin-top: 25px; font-size: 12px; color: #94a3b8; text-align: center; letter-spacing: 0.3px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Simulador de Empréstimo Diário</h2>
    
    <div class="form-group">
        <label for="nome">Seu Nome:</label>
        <input type="text" id="nome" placeholder="Digite seu nome completo">
    </div>

    <div class="form-group">
        <label for="valor">Valor Desejado (R$):</label>
        <input type="number" id="valor" placeholder="Ex: 500" oninput="calcular()">
    </div>

    <div class="form-group">
        <label for="parcelas">Quantidade de Dias (Parcelas):</label>
        <select id="parcelas" onchange="calcular()">
            <!-- Gera de 1 a 30 dias automaticamente -->
            <script>
                for(let i=1; i<=30; i++) {
                    document.write(`<option value="${i}">${i} ${i === 1 ? 'Dia' : 'Dias'}</option>`);
                }
            </script>
        </select>
    </div>

    <div class="resultado">
        <p><span>Taxa Total (Período):</span> <strong id="txtTaxa">10%</strong></p>
        <p><span>Valor da Parcela Diária:</span> <strong id="txtParcela">R$ 0,00</strong></p>
        <p class="total-destaque"><span>Total a Pagar:</span> <strong id="txtTotal">R$ 0,00</strong></p>
    </div>

    <button id="btnSolicitar" onclick="solicitarEmprestimo()">Solicitar via WhatsApp</button>
    <div id="loadingMsg" class="loading">Salvando pedido e abrindo WhatsApp...</div>
</div>

<div class="footer">Desenvolvido por EFK Solutions</div>

<script>
    const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbwsni3G8ZTrwqdelUG5UMOKsHRSzjfZF-tr3c8dHTGwjmuUt8TPHCXJaVm42syIZGda/exec";
    const TAXA_JUROS_TOTAL = 0.10; // 10% no ciclo total (ou ajuste conforme a regra diária desejada)

    function formatarMoedaBR(valor) {
        return Number(valor || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function calcular() {
        let valor = parseFloat(document.getElementById('valor').value) || 0;
        let qtdDias = parseInt(document.getElementById('parcelas').value);

        if (valor <= 0) {
            document.getElementById('txtParcela').innerText = "R$ 0,00";
            document.getElementById('txtTotal').innerText = "R$ 0,00";
            return;
        }

        let totalJuros = valor * (1 + TAXA_JUROS_TOTAL);
        let valorParcelaDiaria = totalJuros / qtdDias;

        document.getElementById('txtParcela').innerText = formatarMoedaBR(valorParcelaDiaria);
        document.getElementById('txtTotal').innerText = formatarMoedaBR(totalJuros);
    }

    async function solicitarEmprestimo() {
        let nome = document.getElementById('nome').value.trim();
        let valor = parseFloat(document.getElementById('valor').value) || 0;
        let qtdDias = parseInt(document.getElementById('parcelas').value);

        if (!nome) {
            alert("Por favor, preencha o seu nome.");
            return;
        }
        if (valor <= 0) {
            alert("Por favor, informe um valor válido para o empréstimo.");
            return;
        }

        let totalJuros = valor * (1 + TAXA_JUROS_TOTAL);
        let valorParcelaDiaria = totalJuros / qtdDias;

        let dadosEnvio = {
            nomeCliente: nome,
            valorEmprestado: valor,
            taxaJuros: (TAXA_JUROS_TOTAL * 100) + "%",
            qtdParcelas: qtdDias,
            valorTotal: totalJuros.toFixed(2)
        };

        let btn = document.getElementById('btnSolicitar');
        btn.disabled = true;
        btn.innerText = "Salvando na planilha...";
        document.getElementById('loadingMsg').style.display = 'block';

        try {
            await fetch(URL_APPS_SCRIPT, {
                method: 'POST',
                mode: 'no-cors', 
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dadosEnvio)
            });

            await new Promise(resolve => setTimeout(resolve, 1000));

            let seuNumeroWhatsApp = "5511982778075"; 
            let mensagem = `Olá! Meu nome é *${nome}*.\n\nAcabei de simular um empréstimo diário:\n` +
                           `- Valor: ${formatarMoedaBR(valor)}\n` +
                           `- Prazo: ${qtdDias} dias (Parcelas diárias de ${formatarMoedaBR(valorParcelaDiaria)})\n` +
                           `- Total com juros: ${formatarMoedaBR(totalJuros)}\n\n` +
                           `Gostaria de prosseguir com a solicitação!`;

            let urlWhatsApp = `https://wa.me/${seuNumeroWhatsApp}?text=${encodeURIComponent(mensagem)}`;
            window.location.href = urlWhatsApp;

        } catch (erro) {
            alert("Houve um erro ao registrar na planilha, mas você ainda pode enviar pelo WhatsApp.");
            console.error(erro);
        } finally {
            btn.disabled = false;
            btn.innerText = "Solicitar via WhatsApp";
            document.getElementById('loadingMsg').style.display = 'none';
        }
    }
</script>

</body>
</html>
